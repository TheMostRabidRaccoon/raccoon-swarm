[pytest]
# Tests live in tests/ and import the swarm modules from the repo root, so the
# rootdir (this file's dir) must be on sys.path — pytest adds it automatically
# for rootdir-level conftest/ini. Keep the suite stdlib-only where possible so
# CI doesn't need the heavy model-client stack (anthropic/openai/PyMuPDF/...).
testpaths = tests
pythonpath = .
addopts = -q
