name: tests

# Unit suite for the swarm's safety-critical pure logic: auth comparisons,
# filestore path safety + write verification, and the dispatch state machine.
# These modules are stdlib-only by design, so CI needs nothing beyond pytest —
# no anthropic/openai/PyMuPDF stack required.

on:
  pull_request:
    paths:
      - '**.py'
      - 'tests/**'
      - 'pytest.ini'
      - 'requirements-dev.txt'
      - '.github/workflows/tests.yml'
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'tests/**'
      - 'pytest.ini'
      - 'requirements-dev.txt'
      - '.github/workflows/tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev deps
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      # Cheap syntax guard. pytest only imports the modules tests touch — the
      # 5k-line server module needs the full model-client stack and is never
      # imported in CI, so a bare syntax break there would slip past the suite.
      # py_compile checks syntax without executing imports, so it catches that
      # for every tracked .py file (server, scripts, tests) with no heavy deps.
      - name: Syntax check (py_compile)
        run: git ls-files '*.py' | xargs python -m py_compile

      - name: Run unit suite
        run: python -m pytest
